[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netvane-cli"
version = "1.0.0"
description = "Validate, normalize, trace, and export host indicators from messy text, CSV and JSON."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "0xaprn"}]
keywords = ["security", "domains", "ip", "url", "parser", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.scripts]
netvane = "netvane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
